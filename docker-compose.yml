# Full stack: web + worker + beat + bot + postgres + redis.
# All Python services share one image; the difference is the command.
#
# First run:
#   cp .env.example .env  &&  edit .env (set TELEGRAM_BOT_TOKEN)
#   docker compose up --build
#
# After that, just `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Expose 5432 to host only (127.0.0.1) so DBeaver / TablePlus / psql
    # can connect locally. Bind to all interfaces here would surface a
    # dev DB to your network — don't.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    image: olx-domria-scraper:latest
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: olx-domria-scraper:latest
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      # Bind-mount the gazetteer/ folder read-only so
      # `manage.py load_gazetteer /app/gazetteer` just works without `docker
      # compose cp`. Folder isn't in the image (see .dockerignore).
      - ./gazetteer:/app/gazetteer:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: olx-domria-scraper:latest
    command: celery -A config worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: olx-domria-scraper:latest
    command: celery -A config beat --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  bot:
    image: olx-domria-scraper:latest
    command: python manage.py run_bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
