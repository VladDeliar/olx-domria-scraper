{% load static %}
<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RealEstate Radar{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f6f7f9; }
        .listing-card img { object-fit: cover; height: 180px; width: 100%; }
        .listing-card .card-title { font-size: 1rem; line-height: 1.3; }
        .filter-form .form-label { font-size: .85rem; margin-bottom: .15rem; }
        .table-sm td, .table-sm th { padding: .35rem .5rem; }
        .price { font-weight: 600; }
        .badge-source-olx { background: #6f2da8; }
        .badge-source-domria { background: #1e7c4d; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'listings:list' %}">📡 RealEstate Radar</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'listings:list' %}">Оголошення</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'listings:dashboard' %}">Дашборд</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/">Адмінка</a></li>
            <li class="nav-item"><a class="nav-link" href="/api/listings/">REST API</a></li>
        </ul>
    </div>
</nav>
<main class="container pb-5">
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% elif m.tags == 'warning' %}warning{% elif m.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show" role="alert">
                {{ m }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
